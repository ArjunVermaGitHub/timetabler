<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timetabler</title>
    <link
      rel="preload"
      href="/fonts/nunito-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/source-sans-3.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Self-hosted + preloaded; `block` avoids painting a fallback that then resizes */
      @font-face {
        font-family: 'Nunito Sans';
        src: url('/fonts/nunito-sans.woff2') format('woff2-variations');
        font-weight: 200 1000;
        font-stretch: 75% 125%;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Source Sans 3';
        src: url('/fonts/source-sans-3.woff2') format('woff2-variations');
        font-weight: 200 900;
        font-style: normal;
        font-display: block;
      }
      /* charismap's copied components ask for its brand fonts; serve ours instead.
         Slabien is a heavy display face, so pin every weight to a firm 650. */
      @font-face {
        font-family: 'Slabien';
        src: url('/fonts/nunito-sans.woff2') format('woff2-variations');
        font-weight: 650;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Poppins';
        src: url('/fonts/nunito-sans.woff2') format('woff2-variations');
        font-weight: 200 1000;
        font-style: normal;
        font-display: block;
      }
    </style>
  </head>
  <body>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('timetabler-theme') === 'dark' ? 'dark' : 'light'
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
